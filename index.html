<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday ^^</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,700&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6a1b3;--title:#fff;--plate:#fff;--cake:#a97c68;--cake-dark:#7b5544;--icing:#fdf0e6;--candle:#f7d3a8;--text:#c4566e;--ink:#3a1f28;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#c9758a;--text:#fbe3ea}}
:root[data-theme="dark"]{--bg:#c9758a;--text:#fbe3ea}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-family:'Dancing Script',cursive,serif;overflow-x:hidden}
h1{margin:0;font:italic 700 clamp(22px,6vw,34px)/1.2 'Poppins',Arial,sans-serif;color:var(--title);text-align:center;padding:0 12px}
.stage{position:relative;width:280px;height:220px}
.stage>*{position:absolute;left:50%;will-change:transform,opacity}
.plate{bottom:0;width:0;height:3px;background:var(--plate);transform:translateX(-50%)}
.layer{width:170px;height:28px;margin-left:-85px;background:linear-gradient(var(--cake) 0 38%,var(--cake-dark) 38% 62%,var(--cake) 62%);border-radius:3px;opacity:0;transform:translateY(-160px)}
.l1{bottom:3px}.l2{bottom:31px}.l3{bottom:59px}
.icing{bottom:87px;width:176px;height:12px;margin-left:-88px;background:var(--icing);border-radius:6px 6px 2px 2px;transform:scaleX(0)}
.drip{bottom:70px;width:14px;background:var(--icing);border-radius:0 0 8px 8px;transform:scaleY(0);transform-origin:top}
.d1{height:20px;margin-left:-78px}.d2{height:30px;margin-left:-44px}.d3{height:16px;margin-left:-6px}.d4{height:26px;margin-left:30px}.d5{height:18px;margin-left:62px}
.candle{bottom:99px;width:7px;height:36px;margin-left:-3px;background:repeating-linear-gradient(-45deg,var(--candle) 0 5px,#fff 5px 9px);border-radius:2px;opacity:0;transform:translateY(-140px)}
.flame{bottom:134px;width:10px;height:18px;margin-left:-5px;background:radial-gradient(ellipse at 50% 70%,#fff6c4,#ffb02e 60%,#ff7a18);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;box-shadow:0 0 14px 5px rgba(255,190,60,.55);transform-origin:50% 100%;transform:scale(0);filter:blur(.3px)}
.go .plate{animation:plate 1s cubic-bezier(.4,0,.2,1) forwards}
.go .layer{animation:drop .9s cubic-bezier(.22,.8,.3,1) forwards}
.go .l1{animation-delay:.9s}.go .l2{animation-delay:1.5s}.go .l3{animation-delay:2.1s}
.go .icing{animation:icing .9s cubic-bezier(.4,0,.2,1) 2.9s forwards}
.go .drip{animation:drip 1s cubic-bezier(.3,.6,.3,1) 3.4s forwards}
.go .d2{animation-delay:3.55s}.go .d3{animation-delay:3.7s}.go .d4{animation-delay:3.5s}.go .d5{animation-delay:3.65s}
.go .candle{animation:drop .8s cubic-bezier(.22,.8,.3,1) 4.3s forwards}
.go .flame{animation:light .6s ease-out 5.1s forwards,flicker .35s ease-in-out 5.7s infinite alternate}
@keyframes plate{to{width:250px}}
@keyframes drop{to{opacity:1;transform:translateY(0)}}
@keyframes icing{to{transform:scaleX(1)}}
@keyframes drip{to{transform:scaleY(1)}}
@keyframes light{to{transform:scale(1)}}
@keyframes flicker{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08,.94) rotate(3deg)}}
.msg{text-align:center;color:var(--text);line-height:1.2}
.msg .hb{font-size:30px;margin:0;opacity:0}
.msg .nm{font-size:22px;margin:2px 0 0;opacity:0;outline:none;border-bottom:1px dashed transparent}
.msg .nm:focus{border-bottom-color:var(--text)}
.go~.msg .hb{animation:fade 1.2s ease-out 5.4s forwards}
.go~.msg .nm{animation:fade 1.2s ease-out 5.9s forwards}
@keyframes fade{to{opacity:1}}
button{font:600 14px 'Poppins',Arial,sans-serif;color:var(--ink);background:#fff;border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
button:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.go *{animation-duration:.01s!important}}
</style>
</head>
<body>
<h1>Happy Birthday ^^</h1>
<div class="stage go" id="stage">
  <div class="plate"></div>
  <div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div>
  <div class="icing"></div>
  <div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div><div class="drip d4"></div><div class="drip d5"></div>
  <div class="candle"></div><div class="flame"></div>
</div>
<div class="msg" id="msg">
  <p class="hb">happy birthday!</p>
  <p class="nm" contenteditable="true" spellcheck="false" title="Click to change the name">(from Nekomen)</p>
</div>
<button id="replay">Replay ↻</button>
<script>
var stage=document.getElementById('stage');
document.getElementById('replay').addEventListener('click',function(){
  stage.classList.remove('go');void stage.offsetWidth;stage.classList.add('go');
});
</script>
</body>
</html>
